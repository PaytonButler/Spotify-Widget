<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="app">
    <div class="window-controls">
      <div class="min-btn" id="minBtn">–</div>
      <div class="close-btn" id="closeBtn">✕</div>
    </div>

    <div class="main-content">
      <div class="top-row">
        <div class="volume-rail">
          <input type="range" id="volumeSlider" min="0" max="100" value="50" />
          <div class="heart-btn" id="heartBtn">
            <svg id="heartIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path
                d="M12 21s-7.5-4.7-10-9.3C0.2 8.1 1.8 4 5.6 3.1 8 2.5 10.3 3.6 12 6.1c1.7-2.5 4-3.6 6.4-3 3.8 0.9 5.4 5 3.6 8.6C19.5 16.3 12 21 12 21z"
                stroke="white" stroke-width="1.5" />
            </svg>
          </div>
        </div>

        <div class="vinyl" id="vinyl">
          <img id="albumArt" src="" alt="" />
        </div>
      </div>

      <div class="track-info">
        <a id="trackName" target="_blank">Not playing</a>
        <div id="artistName"></div>
      </div>
      <div class="controls">
        <button id="prevBtn">⏮</button>
        <button id="playPauseBtn">⏸</button>
        <button id="nextBtn">⏭</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>

</html>
